name: Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        default: 'sync'
        type: choice
        options:
          - sync
          - report
          - all

env:
  ORG: coccinella-labs
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.action == 'sync' || github.event.inputs.action == 'all' || github.event_name == 'schedule'
    steps:
      - name: Get App token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Export token
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Compare repos
        run: |
          python3 << 'PYEOF'
          import os
          import sys
          import requests

          org = os.environ.get('ORG', 'coccinella-labs')
          token = os.environ.get('GH_TOKEN', '')
          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          def fetch_config_repos(org):
              url = f'https://raw.githubusercontent.com/{org}/config/main/repos.json'
              resp = requests.get(url, headers=headers, timeout=30)
              if resp.status_code != 200:
                  print(f'ERROR: config fetch failed: {url} -> HTTP {resp.status_code}: {resp.text[:500]}', file=sys.stderr)
                  sys.exit(1)
              try:
                  data = resp.json()
              except ValueError as e:
                  print(f'ERROR: config is not valid JSON: {e}', file=sys.stderr)
                  sys.exit(1)
              repos = data.get('repos', [])
              if not isinstance(repos, list):
                  print(f'ERROR: config repos.json "repos" is not a list: {repos!r}', file=sys.stderr)
                  sys.exit(1)
              return sorted(repos)

          def fetch_github_repos(org):
              repos = []
              page = 1
              while True:
                  resp = requests.get(
                      f'https://api.github.com/orgs/{org}/repos',
                      headers=headers,
                      params={'per_page': '100', 'page': str(page)},
                      timeout=30,
                  )
                  if resp.status_code != 200:
                      print(f'ERROR: GitHub API failed: org={org} HTTP {resp.status_code}: {resp.text[:500]}', file=sys.stderr)
                      sys.exit(1)
                  try:
                      data = resp.json()
                  except ValueError as e:
                      print(f'ERROR: GitHub API returned invalid JSON: {e}', file=sys.stderr)
                      sys.exit(1)
                  if not isinstance(data, list):
                      print(f'ERROR: unexpected GitHub API response (expected list): {str(data)[:500]}', file=sys.stderr)
                      sys.exit(1)
                  if not data:
                      break
                  repos.extend([r['name'] for r in data if isinstance(r, dict) and 'name' in r])
                  if len(data) < 100:
                      break
                  page += 1
              return sorted(repos)

          config_repos = fetch_config_repos(org)
          gh_repos = fetch_github_repos(org)

          print('Config repos ({0}): {1}'.format(len(config_repos), config_repos))
          print('GitHub repos ({0}): {1}'.format(len(gh_repos), gh_repos))

          if config_repos == gh_repos:
            print('REPOS_IN_SYNC=true')
          else:
            print('REPOS_IN_SYNC=false')
            missing = set(config_repos) - set(gh_repos)
            extra = set(gh_repos) - set(config_repos)
            if missing:
              print('Missing in GitHub: ' + str(sorted(missing)))
            if extra:
              print('Extra in GitHub: ' + str(sorted(extra)))
          PYEOF

      - name: Report status
        run: |
          echo "Sync check complete"

  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.action == 'report' || github.event.inputs.action == 'all' || github.event_name == 'schedule'
    steps:
      - name: Get App token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Export token
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate report
        run: |
          python3 << 'PYEOF'
          import os
          import sys
          import requests
          from datetime import datetime

          org = os.environ.get('ORG', 'coccinella-labs')
          token = os.environ.get('GH_TOKEN', '')
          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          repos = []
          page = 1
          while True:
              repos_resp = requests.get(
                  f'https://api.github.com/orgs/{org}/repos',
                  headers=headers,
                  params={'per_page': '100', 'page': str(page)},
                  timeout=30,
              )
              if repos_resp.status_code != 200:
                  print(f'ERROR: GitHub API failed: org={org} HTTP {repos_resp.status_code}: {repos_resp.text[:500]}', file=sys.stderr)
                  sys.exit(1)
              try:
                  data = repos_resp.json()
              except ValueError as e:
                  print(f'ERROR: GitHub API returned invalid JSON: {e}', file=sys.stderr)
                  sys.exit(1)
              if not isinstance(data, list):
                  print(f'ERROR: unexpected GitHub API response (expected list): {str(data)[:500]}', file=sys.stderr)
                  sys.exit(1)
              if not data:
                  break
              repos.extend(data)
              if len(data) < 100:
                  break
              page += 1

          report = []
          report.append(f'# {org} Organization Report')
          report.append('')
          report.append('Generated: ' + datetime.now().strftime('%Y-%m-%d %H:%M:%S'))
          report.append('')
          report.append('## Summary')
          report.append('- Repositories: ' + str(len(repos)))
          report.append('')
          report.append('## Repositories')

          for repo in repos:
              if not isinstance(repo, dict) or 'name' not in repo:
                  continue
              name = repo['name']
              url = repo.get('html_url', f'https://github.com/{org}/{name}')
              report.append('- [' + name + '](' + url + ')')

          report_text = '\n'.join(report)

          with open('report.md', 'w') as f:
            f.write(report_text)

          print(report_text)
          print('')
          print('Report saved to report.md')
          PYEOF

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: org-report
          path: report.md
          retention-days: 7
